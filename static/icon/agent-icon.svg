<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sprint Sentinel">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2684FF"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <!-- Sentinel shield -->
  <path fill="url(#shield)"
        d="M64 8 L108 24 V62 C108 92 90 112 64 120 C38 112 20 92 20 62 V24 Z"/>
  <!-- Sprint-health pulse line -->
  <path fill="none" stroke="#FFFFFF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"
        d="M33 68 H50 L58 48 L70 86 L78 68 H95"/>
  <!-- Alert dot: an at-risk signal the sentinel catches -->
  <circle cx="95" cy="40" r="10" fill="#FF5630" stroke="#FFFFFF" stroke-width="4"/>
</svg>
